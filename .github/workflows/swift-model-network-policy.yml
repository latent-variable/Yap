name: Swift model network policy

on:
  pull_request:
    paths:
      - ".github/workflows/swift-model-network-policy.yml"
      - "app/Sources/Yap/ModelNetworkPolicy.swift"
      - "app/Sources/Yap/YapApp.swift"
      - "app/Tests/YapTests/ModelNetworkPolicyTests.swift"
      - "app/Package.resolved"
      - "app/Package.swift"

permissions:
  contents: read

concurrency:
  group: yap-model-network-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and run model-network policy regression
        run: |
          swift build --package-path app --build-tests
          swift test --package-path app --filter ModelNetworkPolicyTests
