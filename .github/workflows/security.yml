name: Security

# The security gate an agent runs before a merge (scripts/audit-deps.sh,
# scripts/audit-code.sh), on a clean checkout of every pull request: known
# vulnerable dependencies (OSV-Scanner), dangerous code in the changed files
# (Semgrep) and secrets in the branch's commits (gitleaks). Seconds each.
#
# The Swift build and the probes are not here: they need macOS, a signed bundle
# and real devices, and stay on the Mac. Yap is public, so this standard runner
# spends no Actions minutes.
on:
  pull_request:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: security gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # audit-code diffs against the merge base with main

      # Pinned release binaries, checksummed, as the other repos install them.
      - name: Install osv-scanner v2.7.0
        run: |
          curl -sSfL -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  /tmp/osv-scanner" | sha256sum -c -
          install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep and gitleaks
        run: |
          pip install semgrep==1.181.0
          curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks

      - name: Dependencies (OSV-Scanner)
        run: bash scripts/audit-deps.sh
      - name: Code and secrets (Semgrep, gitleaks)
        run: bash scripts/audit-code.sh
