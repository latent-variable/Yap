name: Lock Python dependencies

# Resolve on the same Apple Silicon / CPython target used by Yap's bundled
# runtime. The resolver job has read-only repository access; only the separate
# commit job receives contents:write, and it only commits generated lockfiles.
on:
  push:
    branches:
      - security/pin-python-runtime
    paths:
      - ".github/workflows/lock-python-deps.yml"
      - "backend/requirements.txt"
      - "backend/requirements-pocket.txt"
      - "scripts/bundle_python.sh"

permissions:
  contents: read

concurrency:
  group: yap-python-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve and verify macOS arm64 Python locks
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.16"

      - name: Verify lock target and install pinned resolver
        run: |
          test "$(uname -m)" = "arm64"
          python --version
          python -m pip install --isolated --disable-pip-version-check pip-tools==7.6.2

      - name: Compile complete hash-locked dependency sets
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_INDEX_URL: https://pypi.org/simple
        run: |
          pip-compile --upgrade --generate-hashes --allow-unsafe \
            --resolver=backtracking --strip-extras --no-emit-index-url \
            --pip-args="--only-binary=:all:" \
            --output-file=backend/requirements.lock backend/requirements.txt
          pip-compile --upgrade --generate-hashes --allow-unsafe \
            --resolver=backtracking --strip-extras --no-emit-index-url \
            --pip-args="--only-binary=:all:" \
            --output-file=backend/requirements-pocket.lock backend/requirements-pocket.txt

      - name: Verify every default runtime dependency from its lock
        env:
          PIP_CONFIG_FILE: /dev/null
        run: |
          python -m venv "$RUNNER_TEMP/yap-default"
          "$RUNNER_TEMP/yap-default/bin/python" -m pip install --isolated \
            --disable-pip-version-check --require-hashes --only-binary=:all: \
            --no-cache-dir -r backend/requirements.lock
          "$RUNNER_TEMP/yap-default/bin/python" -I -c \
            "import kokoro_onnx, onnxruntime, fastapi, soundfile; print('default runtime imports OK')"

      - name: Verify optional Pocket lock can install as the app does
        env:
          PIP_CONFIG_FILE: /dev/null
        run: |
          mkdir -p "$RUNNER_TEMP/yap-pocket"
          python -m pip install --isolated --disable-pip-version-check \
            --require-hashes --only-binary=:all: --no-cache-dir \
            --target "$RUNNER_TEMP/yap-pocket" \
            -r backend/requirements-pocket.lock
          PYTHONPATH="$RUNNER_TEMP/yap-pocket" python -c \
            "import torch, pocket_tts, kokoro_onnx, onnxruntime; print('Pocket runtime imports OK', torch.__version__)"

      - name: Upload generated lockfiles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yap-python-lockfiles
          path: |
            backend/requirements.lock
            backend/requirements-pocket.lock
          if-no-files-found: error
          retention-days: 3

  commit-locks:
    name: Commit generated lockfiles
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: yap-python-lockfiles
          path: backend
      - name: Commit lockfiles to the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/requirements.lock backend/requirements-pocket.lock
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git diff --cached --check
          git commit -m "build: lock Python runtime dependencies with hashes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
