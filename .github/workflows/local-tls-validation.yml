name: Local TLS identity and backend recovery

on:
  pull_request:
    paths:
      - ".github/workflows/local-tls-validation.yml"
      - "app/Sources/Yap/BackendAuth.swift"
      - "app/Sources/Yap/BackendClient.swift"
      - "app/Sources/Yap/BackendManager.swift"
      - "app/Sources/Yap/CLITest.swift"
      - "app/Tests/YapTests/**"
      - "backend/server.py"
      - "backend/local_tls.py"
      - "backend/tests/test_auth.py"
      - "backend/tests/test_local_tls.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yap-local-tls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir pytest==9.0.2 fastapi==0.128.2 numpy==2.3.5
      - name: Test token auth and TLS certificate/key creation
        env:
          YAP_AUTH_TOKEN_FILE: ${{ runner.temp }}/yap-auth-identity-token
        run: |
          python -m py_compile backend/local_tls.py backend/server.py backend/tests/test_local_tls.py
          cd backend
          python -m pytest tests/test_auth.py tests/test_local_tls.py -v

  macos-swift:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and test pinned-TLS client and lifecycle
        run: |
          swift build --package-path app --build-tests
          swift test --package-path app
      - name: Verify no default cleartext backend URL remains
        run: |
          ! grep -R 'http://127.0.0.1:8766' app/Sources/Yap/BackendClient.swift app/Sources/Yap/BackendManager.swift
