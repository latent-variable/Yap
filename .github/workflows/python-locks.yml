name: python-locks

# The hash locks must match their inputs, and both environments must install
# from them on the interpreter the app ships.
on:
  pull_request:
    paths:
      - "backend/requirements*"
      - "scripts/python_pin.sh"
      - "scripts/lock_python_deps.sh"
      - "scripts/bundle_python.sh"
      - ".github/workflows/python-locks.yml"

permissions:
  contents: read

jobs:
  locks:
    runs-on: macos-15   # Apple Silicon, the only target the pin covers
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Locks match their inputs
        run: bash scripts/lock_python_deps.sh --check
      - name: Default runtime installs from its lock
        run: bash scripts/bundle_python.sh
      - name: Pocket environment installs from its lock
        run: |
          py=dist/python-runtime/bin/python3
          "$py" -I -m pip install -q --isolated --disable-pip-version-check \
            --no-cache-dir --require-hashes --only-binary=:all: \
            --target "$RUNNER_TEMP/hd-packages" -r backend/requirements-pocket.txt
          PYTHONPATH="$RUNNER_TEMP/hd-packages" "$py" -c \
            "import pocket_tts, kokoro_onnx, onnxruntime, torch; print('pocket env ok', torch.__version__)"
